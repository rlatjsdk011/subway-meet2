const officialStep=(line,a,b)=>{const match=line.match(/^([1-9])호선/);if(!match)return null;const pair=[a,b].sort();return OFFICIAL_EDGES[match[1]+'|'+pair[0]+'|'+pair[1]]??null;};
const blockedTransfers=new Set(['신촌|2호선|경의중앙선','신촌|2호선|경의중앙선 본선','양평|5호선|경의중앙선 본선','원당|3호선|인천2호선']);
const canTransfer=(station,a,b)=>!blockedTransfers.has([station,a,b].join('|'))&&!blockedTransfers.has([station,b,a].join('|'));
const baseWait=(line)=>line.includes('GTX')?7:line.includes('경의')?4:line.includes('경춘')||line.includes('경강')||line.includes('서해')?8:line.includes('공항')?5:line.includes('1호선')||line.includes('4호선')?4:3;
// 서울교통공사 공개 환승거리 자료(2025-03-31)의 일부 확인된 환승 보행시간(분).
// 자료가 없는 환승은 별도의 추정값으로 남겨 둔다.
const VERIFIED_TRANSFER_WALK={
 '서울역|1호선|4호선':133/60,'서울역|1호선|공항철도':258/60,
 '시청|1호선|2호선':84/60,'종로3가|1호선|3호선':98/60,
 '종로3가|1호선|5호선':260/60,'동대문|1호선|4호선':162/60,
 '동묘앞|1호선|6호선':80/60,'신설동|1호선|2호선 성수지선':133/60,
 '을지로3가|2호선|3호선':124/60,'을지로4가|2호선|5호선':64/60,
 '동대문역사문화공원|2호선|4호선':38/60,
 '동대문역사문화공원|2호선|5호선':195/60,
 '신당|2호선|6호선':202/60,'왕십리|2호선|5호선':72/60,
 '왕십리|2호선|수인분당선':83/60,'왕십리|2호선|경의중앙선 본선':42/60,
 '건대입구|2호선|7호선':64/60,'잠실|2호선|8호선':158/60,
 '종합운동장|2호선|9호선':78/60,'선릉|2호선|수인분당선':68/60,
 '강남|2호선|신분당선':178/60,'교대|2호선|3호선':63/60
};
const transferWalk=(station,a,b)=>VERIFIED_TRANSFER_WALK[station+'|'+a+'|'+b]??VERIFIED_TRANSFER_WALK[station+'|'+b+'|'+a];
const baseTransfer=(station,a,b)=>{if(a===b)return 0;if(station==='구리'&&((a==='8호선'&&b==='경의중앙선 본선')||(b==='8호선'&&a==='경의중앙선 본선')))return 3;const verified=transferWalk(station,a,b);return verified===undefined?6:verified;};
const getSettings=()=>({wait:0,transfer:0,speed:1});
// 공식 CSV의 STT(도착)~EDT(출발) 차이: 1~9호선 중앙값 30초.
// 기존 역간 구간은 앞역 출발~다음역 도착만 합산해 중간 정차시간을 누락했음.
const dwellMinutes=(line)=>/^([1-9])호선/.test(line)?0.5:0;
for(const [line,arr] of entries){for(let i=0;i<arr.length;i++){let s=arr[i],k=key(line,s);if(!memberships.has(s))memberships.set(s,[]);memberships.get(s).push(k);if(!graph.has(k))graph.set(k,[]);if(i){let prev=key(line,arr[i-1]),w=officialStep(line,arr[i-1],s)??fallbackStepTime(line);if(line==='6호선'&&i<=6){add(prev,k,w);}else{add(k,prev,w);add(prev,k,w);}}}}
for(const [,nodes] of memberships){for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){let a=nodes[i].split('|')[0],b=nodes[j].split('|')[0];if(a===b||!canTransfer(nodes[i].split('|').slice(1).join('|'),a,b))continue;add(nodes[i],nodes[j],baseTransfer(nodes[i].split("|").slice(1).join("|"),a,b));add(nodes[j],nodes[i],baseTransfer(nodes[i].split("|").slice(1).join("|"),a,b));}}
class Heap{constructor(){this.a=[]}push(v){let a=this.a;a.push(v);let i=a.length-1;while(i){let p=(i-1)>>1;if(a[p].d<=v.d)break;a[i]=a[p];i=p}a[i]=v}pop(){let a=this.a;if(!a.length)return null;let top=a[0],v=a.pop();if(a.length){let i=0;while(true){let l=i*2+1,r=l+1;if(l>=a.length)break;let c=r<a.length&&a[r].d<a[l].d?r:l;if(a[c].d>=v.d)break;a[i]=a[c];i=c}a[i]=v}return top}}
function shortest(origin,settings){let dist=new Map(),prev=new Map(),heap=new Heap();for(let node of memberships.get(origin)||[]){let w=baseWait(node.split("|")[0])+settings.wait;dist.set(node,w);heap.push({k:node,d:w})}while(true){let cur=heap.pop();if(!cur)break;if(cur.d!==dist.get(cur.k))continue;for(let edge of graph.get(cur.k)||[]){let transfer=cur.k.split("|")[0]!==edge.to.split("|")[0];let fromLine=cur.k.split('|')[0],toLine=edge.to.split('|')[0];let nd=cur.d+(transfer?edge.w+Math.max(0,baseWait(toLine)):edge.w*settings.speed+dwellMinutes(fromLine));if(nd<(dist.get(edge.to)??Infinity)){dist.set(edge.to,nd);prev.set(edge.to,cur.k);heap.push({k:edge.to,d:nd})}}}let best=new Map();for(const [s,nodes] of memberships){let candidate=null;for(const n of nodes){let d=dist.get(n);if(d!==undefined&&(!candidate||d<candidate.d))candidate={d,node:n}}if(candidate)best.set(s,candidate)}best.set(origin,{d:0,node:(memberships.get(origin)||[])[0]});return {best,prev,origin}}
function route(res,target){if(target===res.origin)return '출발역과 동일';let end=res.best.get(target)?.node;if(!end)return '경로 없음';let nodes=[end],seen=new Set([end]);while(res.prev.has(nodes[0])){let p=res.prev.get(nodes[0]);if(seen.has(p))break;nodes.unshift(p);seen.add(p)}let parts=[];for(let n of nodes){let [line,...station]=n.split('|');let s=station.join('|');if(!parts.length||parts[parts.length-1].line!==line)parts.push({line,from:s,to:s});else parts[parts.length-1].to=s}return parts.map(p=>`${p.line}: ${p.from}${p.from===p.to?'':' → '+p.to}`).join(' / 환승 / ')}
const personFields=document.getElementById('personFields');const people=[];let nextPersonId=0;const alphabet='ABCDEFGH';
function updatePeople(){document.getElementById('personCount').textContent=`현재 ${people.length}명 / 최대 8명`;document.getElementById('addPerson').disabled=people.length>=8;document.getElementById('addPerson').style.opacity=people.length>=8?'.45':'1';for(let i=0;i<people.length;i++){people[i].label.textContent=`${alphabet[i]} 출발역`;people[i].remove.hidden=people.length<=2;}}
function addPerson(value=''){if(people.length>=8)return;const id=++nextPersonId;const field=document.createElement('div');field.className='field';const head=document.createElement('div');head.className='fieldhead';const label=document.createElement('label');label.htmlFor='start'+id;const remove=document.createElement('button');remove.type='button';remove.className='remove';remove.textContent='삭제';remove.onclick=()=>{if(people.length<=2)return;const idx=people.findIndex(p=>p.id===id);if(idx>=0){people.splice(idx,1);field.remove();updatePeople();}};head.append(label,remove);const input=document.createElement('input');input.id='start'+id;input.autocomplete='off';input.placeholder='예: 연신내';input.setAttribute('aria-autocomplete','list');input.value=value;const menu=document.createElement('div');menu.className='suggestions';const hint=document.createElement('div');hint.className='hint';hint.textContent='역 이름을 입력하고 목록에서 선택';field.append(head,input,menu,hint);personFields.append(field);people.push({id,input,label,remove});
function render(){const q=input.value.trim().replace(/역$/,'');const matches=stations.filter(s=>s.includes(q)).slice(0,12);menu.replaceChildren();if(!q||!matches.length){menu.classList.remove('open');return}for(const station of matches){const btn=document.createElement('button');btn.type='button';btn.textContent=station+'역';btn.onclick=()=>{input.value=station;menu.classList.remove('open')};menu.append(btn)}menu.classList.add('open')}
input.addEventListener('input',render);input.addEventListener('focus',render);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&menu.classList.contains('open')){e.preventDefault();menu.querySelector('button')?.click()}if(e.key==='Escape')menu.classList.remove('open')});document.addEventListener('click',e=>{if(!field.contains(e.target))menu.classList.remove('open')});updatePeople()}
addPerson();addPerson();document.getElementById('addPerson').onclick=()=>addPerson();
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}function metric(label,val){const d=el('div','metric');d.append(el('b','',val),el('span','',label));return d}document.getElementById('calculate').onclick=()=>{const origins=people.map(p=>p.input.value.trim().replace(/역$/,''));const status=document.getElementById('status'),section=document.getElementById('results'),cards=document.getElementById('cards');status.textContent='';const invalid=origins.findIndex(x=>!memberships.has(x));if(invalid!==-1){status.textContent=`${alphabet[invalid]} 출발역을 목록에서 정확히 선택해 주세요.`;section.style.display='none';return}const settings=getSettings();const routes=origins.map(origin=>shortest(origin,settings));const results=[];for(const station of stations){const times=routes.map(r=>r.best.get(station)?.d);if(times.some(t=>t===undefined))continue;const max=Math.max(...times),min=Math.min(...times),sum=times.reduce((a,b)=>a+b,0);results.push({station,times,max,gap:max-min,sum})}results.sort((a,b)=>a.max-b.max||a.gap-b.gap||a.sum-b.sum||a.station.localeCompare(b.station,'ko'));cards.replaceChildren();if(!results.length){status.textContent='모든 출발역에서 도달 가능한 후보역을 찾지 못했습니다.';section.style.display='none';return}for(const [i,o] of results.slice(0,3).entries()){const c=el('article','result');c.append(el('div','rank',`${i+1}위 추천`),el('div','station',o.station+'역'));for(let j=0;j<origins.length;j++){const r=el('div','route person-path');r.append(el('strong','',`${alphabet[j]} · ${origins[j]}역 → ${o.station}역 · 예상 ${Math.round(o.times[j])}분`),el('div','',route(routes[j],o.station)));c.append(r)}cards.append(c)}section.style.display='block';section.scrollIntoView({behavior:'smooth',block:'start'})};
